name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv pip install --system ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Formatting
        run: ruff format --check .

      - name: Run Tests with Coverage
        run: uv run pytest --cov=src tests/ --cov-report=term-missing --cov-fail-under=80

  infrastructure-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked MLflow dependencies and test tools
        run: pip install -r infra/requirements.lock pytest==8.3.5 ruff==0.11.2
      - name: Check infrastructure code
        run: |
          ruff check mlops infra
          ruff format --check mlops infra
          docker compose config --quiet
      - name: Test snapshot, data quality and real MLflow lineage
        run: python -m pytest infra/tests -q
      - name: Build and run infrastructure
        run: |
          docker compose up --build -d mlflow
          docker compose run --rm data-pipeline
          curl --fail http://localhost:5000/health
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
