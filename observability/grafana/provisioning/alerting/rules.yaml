apiVersion: 1
groups:
  - orgId: 1
    name: pipeline
    folder: Pipeline
    interval: 30s
    rules:
      - uid: queue-high
        title: "Очередь заполнена более чем на 90%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm-ds
            model:
              refId: A
              expr: rabbitmq_queue_messages_ready{queue="inference_queue_v2"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [45] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          summary: "inference_queue_v2 держится выше 45/50 (90%) дольше минуты: источник быстрее воркеров, нужен второй воркер или замедление источника"
        labels: { severity: warning }
        isPaused: false

      - uid: dlq-messages
        title: "В DLQ появились сообщения"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vm-ds
            model:
              refId: A
              expr: rabbitmq_queue_messages_ready{queue="inference_queue_v2.dlq"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 30s
        annotations:
          summary: "Сообщения в inference_queue_v2.dlq: ядовитые задачи исчерпали попытки, требуется разбор вручную"
        labels: { severity: critical }
        isPaused: false