apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: vm-ds
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  - name: Loki
    uid: loki-ds
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          datasourceUid: tempo-ds
          url: "$${__value.raw}"
          urlDisplayLabel: "Open trace"

  - name: Tempo
    uid: tempo-ds
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-ds
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      nodeGraph:
        enabled: true