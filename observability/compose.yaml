services:
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    profiles: [logs, observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
    - 127.0.0.1:3100:3100
    volumes:
    - ./loki.yaml:/etc/loki/config.yaml:ro
    - loki_data:/loki
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 384m
    networks: [observability]
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.6.1}
    profiles: [logs, observability]
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      ENV: ${ENV:-dev}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./alloy.alloy:/etc/alloy/config.alloy:ro
    - alloy_data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 128m
    networks: [observability]
  vector:
    image: timberio/vector:${VECTOR_VERSION:-0.43.1-alpine}
    profiles: [logs, observability]
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      ENV: ${ENV:-dev}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./vector.yaml:/etc/vector/vector.yaml:ro
    - vector_data:/var/lib/vector
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 128m
    networks: [observability]
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.7.1}
    profiles: [traces, observability]
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    ports:
    - 127.0.0.1:3200:3200
    volumes:
    - ./tempo.yaml:/etc/tempo.yaml:ro
    - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    networks: [observability]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.165.0}
    profiles: [traces, observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
    mem_limit: 128m
    networks: [backend, observability]

  otel-metrics-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.165.0}
    profiles: [metrics, observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - 127.0.0.1:4327:4317
      - 127.0.0.1:4328:4318
    volumes:
      - ./otel-metrics-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    mem_limit: 128m
    networks: [backend, observability]
    
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VICTORIAMETRICS_VERSION:-v1.156.0}
    profiles: [metrics, observability]
    command:
      - "-retentionPeriod=72h"
      - "-search.maxQueryLen=16KB"
    ports:
      - 127.0.0.1:8428:8428
    volumes:
      - vm_data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "/victoria-metrics-prod", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    mem_limit: 192m
    networks: [observability]
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    profiles: [observability]
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      victoriametrics:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    networks: [observability]
volumes:
  loki_data: null
  alloy_data: null
  vector_data: null
  tempo_data: null
  vm_data: null 
  grafana_data: null
networks:
  observability: null
